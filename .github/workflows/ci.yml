name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps for tests
        run: |
          python -m pip install --upgrade pip
          pip install numpy cryptography ruff

      - name: Byte-compile all sources
        run: python -m compileall -q .

      - name: Lint (syntax + undefined names only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Secure Feature Vault smoke test
        run: python test_lfv.py
