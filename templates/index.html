<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Chatbot</title>

    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h3 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .chat-messages {
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
            border-radius: 8px;
        }

        .bubble {
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: #0078ff;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #e9e9e9;
            color: #333;
            margin-right: auto;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #0078ff;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #0078ff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        button:hover {
            background: #0066dd;
        }

        .reset-btn {
            background: #ff4444;
            padding: 8px 16px;
            font-size: 13px;
        }

        .reset-btn:hover {
            background: #dd3333;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>🤖 Meeting Chatbot</h3>

    <div class="controls">
        <form method="POST" action="/reset" style="margin: 0;">
            <button type="submit" class="reset-btn">🔄 Reset Conversation</button>
        </form>
    </div>

    <div class="chat-messages">
        {% if user_message %}
            <div class="message-wrapper">
                <div class="bubble user">{{ user_message }}</div>
            </div>
            <div class="message-wrapper">
                <div class="bubble bot">{{ bot_response }}</div>
            </div>
        {% else %}
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                <p>Start a conversation about your meetings!</p>
            </div>
        {% endif %}
    </div>

    <form method="POST">
        <input type="text" name="message" placeholder="Ask about your meetings..." required autofocus>
        <button type="submit">Send</button>
    </form>
</div>

<script>
    // Auto-scroll to bottom of chat
    const chatMessages = document.querySelector('.chat-messages');
    if (chatMessages) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
